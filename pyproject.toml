[project]
name = "django-auth-events"
version = "0.1.0"
description = "Auth session event consumer for Django — bridges streambus events with token invalidation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jose Meira", email = "jmeiracorbal@gmail.com" }]
keywords = ["django", "jwt", "authentication", "events", "streambus"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "django>=4.2",
    "streambus>=0.2.0",
]

[dependency-groups]
dev = [
    "django-auth-external>=0.1.0",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
django-auth-external = { path = "../django-auth-external", editable = true }
